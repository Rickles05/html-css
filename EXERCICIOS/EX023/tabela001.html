<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family:Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;
            border-collapse: collapse;
        }
        tr{
            background-color: rgb(165, 163, 163);
        }
        td{
            border: 1px solid black;
            padding: 8px;
        }
        tr.linha{
            background-color: rgb(0, 255, 64);
        }
        td.b2{
            background-color: rgb(238, 255, 0);
        }
    </style>
</head>
<body>
    <h1>MINHA PRIMEIRA TABELA</h1>
    <table>
        <tr> <!-- Primeira linha -->
           <td>A1</td>
           <td>B1</td>
           <td>C1</td>
        </tr>
        <tr> <!-- Segunda linha -->
            <td>A2</td>
            <td class="b2">B2</td>
            <td>C2</td>
        </tr>
        <tr class="linha"> <!-- Terceira linha -->
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr> <!-- Quarta linha -->
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>

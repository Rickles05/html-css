<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 500px;
            border-collapse: collapse;
        }
        caption{
            font-size: 1.3em;
            font-weight: bold;
            padding: 8px;
        }
        th,td{
            border: 1px solid black;
            padding: 8px;
        }
        col.cnome{
            background-color: aqua;
        }
        col.cgrupo{
            background-color: rgb(255, 102, 0);
        }
    </style>
</head>
<body>
    <h1>Exercício de Tabela</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="cgrupo" span="3">
            <col class="cidade">
            <col class="cprofissão">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ilany Maiara</td>
            <td>F</td>
            <td>22</td>
            <td>Vendedora</td>

        </tr>
         <tr>
            <td>Henrique Alves</td>
            <td>M</td>
            <td>25</td>
            <td>Vendedor</td>

        </tr>
         <tr>
            <td>Marcos Carvalho</td>
            <td>M</td>
            <td>28</td>
            <td>Analista de dados</td>

        </tr>
         <tr>
            <td>Adriely Santos</td>
            <td>F</td>
            <td>23</td>
            <td>Contadora</td>

        </tr>
         <tr>
            <td>Wagner Bento</td>
            <td>M</td>
            <td>19</td>
            <td>Agrônomo</td>

        </tr>
         <tr>
            <td>Eduardo Silva</td>
            <td>M</td>
            <td>35</td>
            <td>Motorista</td>

        </tr>
    </table>
</body>
</html>
